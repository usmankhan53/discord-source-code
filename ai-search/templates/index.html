<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Space</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }, colors: { ink: '#10111a', mist: '#f5f5f2', lime: '#d8ff49' } } }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    body { font-family: Manrope, ui-sans-serif, system-ui; }
    .mono { font-family: 'DM Mono', monospace; }
    .answer h2 { font-size: 1.125rem; font-weight: 800; margin: 1.45rem 0 .5rem; }
    .answer h3 { font-size: 1rem; font-weight: 800; margin: 1.2rem 0 .4rem; }
    .answer p { margin: .7rem 0; line-height: 1.75; }
    .answer ul, .answer ol { padding-left: 1.3rem; margin: .7rem 0; line-height: 1.75; }
    .answer ul { list-style: disc; } .answer ol { list-style: decimal; }
    .answer strong { font-weight: 800; }
    .answer code { font-family: 'DM Mono', monospace; font-size: .85em; background: #ecece6; padding: .12rem .3rem; border-radius: .25rem; }
  </style>
</head>
<body class="min-h-screen bg-mist text-ink selection:bg-lime">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col px-5 py-6 sm:px-10 sm:py-9">
    <header class="flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-extrabold tracking-tight"><span class="grid h-8 w-8 place-items-center rounded-lg bg-ink text-lime">✦</span> search space</a>
      <span class="mono hidden rounded-full border border-black/10 px-3 py-1.5 text-[10px] uppercase tracking-[.15em] text-black/55 sm:block">thinking, simplified</span>
    </header>

    <section id="hero" class="flex flex-1 flex-col justify-center py-16 sm:py-24">
      <p class="mono mb-5 text-xs uppercase tracking-[.2em] text-black/45">A quieter way to find answers</p>
      <h1 class="max-w-3xl text-4xl font-extrabold leading-[1.05] tracking-[-.055em] sm:text-6xl">Ask a better<br/><span class="relative inline-block">question<span class="absolute -bottom-1 left-0 h-2 w-full -rotate-1 bg-lime -z-10"></span></span>.</h1>
      <form id="search-form" class="mt-10 max-w-3xl">
        <label for="query" class="sr-only">What are you looking for?</label>
        <div class="group flex items-center rounded-2xl border border-black/15 bg-white p-2 shadow-[0_8px_30px_rgb(0,0,0,.04)] transition focus-within:border-black/40 focus-within:shadow-[0_10px_35px_rgb(0,0,0,.08)]">
          <span class="pl-3 text-xl text-black/35">⌕</span>
          <input id="query" autocomplete="off" autofocus placeholder="What are you curious about?" class="min-w-0 flex-1 bg-transparent px-4 py-3 text-base outline-none placeholder:text-black/35 sm:text-lg" />
          <button id="submit" type="submit" class="rounded-xl bg-ink px-4 py-3 text-sm font-bold text-white transition hover:bg-black disabled:cursor-not-allowed disabled:opacity-60"><span class="hidden sm:inline">Search</span><span class="sm:hidden">→</span></button>
        </div>
        <div class="mt-4 flex flex-wrap gap-2 text-xs text-black/50"><span class="mono mr-1 py-1 uppercase tracking-wider">Try</span><button type="button" class="suggestion rounded-full border border-black/10 px-3 py-1.5 hover:bg-white">Explain quantum computing simply</button><button type="button" class="suggestion rounded-full border border-black/10 px-3 py-1.5 hover:bg-white">Plan a focused workday</button></div>
      </form>
    </section>

    <section id="result" class="hidden max-w-3xl py-12">
      <button id="new-search" class="mono mb-10 text-xs uppercase tracking-[.16em] text-black/55 transition hover:text-black">← New search</button>
      <p id="question" class="mono mb-5 text-xs uppercase tracking-[.13em] text-black/45"></p>
      <article class="rounded-2xl border border-black/10 bg-white p-6 shadow-[0_8px_30px_rgb(0,0,0,.035)] sm:p-9"><div id="answer" class="answer text-[15px] text-black/80"></div><div id="loading" class="flex items-center gap-3 py-3 text-sm text-black/55"><span class="h-2 w-2 animate-pulse rounded-full bg-black"></span>Looking for a clear answer…</div></article>
    </section>
    <footer class="mono flex justify-between text-[10px] uppercase tracking-[.14em] text-black/35"><span>Private search</span><span>Made for curiosity</span></footer>
  </main>
  <script>
    const form = document.querySelector('#search-form'), query = document.querySelector('#query'), hero = document.querySelector('#hero'), result = document.querySelector('#result'), answer = document.querySelector('#answer'), loading = document.querySelector('#loading'), question = document.querySelector('#question'), submit = document.querySelector('#submit');
    const escapeHTML = text => text.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    function renderMarkdown(text) {
      let html = escapeHTML(text);
      html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>').replace(/^## (.*)$/gm, '<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^[-*] (.*)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g, match => '<ul>' + match + '</ul>');
      return html.split(/\n\n+/).map(block => /^(<h|<ul)/.test(block.trim()) ? block : '<p>' + block.replace(/\n/g, '<br>') + '</p>').join('');
    }
    async function runSearch(value) {
      const term = value.trim();
      if (term.length < 2) { query.focus(); return; }
      hero.classList.add('hidden'); result.classList.remove('hidden'); question.textContent = term; answer.innerHTML = ''; loading.classList.remove('hidden'); submit.disabled = true;
      window.scrollTo({top: 0, behavior: 'smooth'});
      try {
        const response = await fetch('/search', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query:term})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Something went wrong');
        answer.innerHTML = renderMarkdown(data.answer);
      } catch (error) {
        answer.innerHTML = '<p><strong>Couldn’t complete that search.</strong><br>' + escapeHTML(error.message) + '</p>';
      } finally {
        loading.classList.add('hidden'); submit.disabled = false;
      }
    }
    form.addEventListener('submit', event => { event.preventDefault(); runSearch(query.value); });
    document.querySelectorAll('.suggestion').forEach(button => button.addEventListener('click', () => { query.value = button.textContent; runSearch(query.value); }));
    document.querySelector('#new-search').addEventListener('click', () => { result.classList.add('hidden'); hero.classList.remove('hidden'); query.focus(); });
  </script>
</body>
</html>
